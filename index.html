<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#161616">
  <meta name="description" content="José Maria — an index of shipped ideas: small tools and websites built in public.">
  <title>José Maria</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;700;800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <aside class="sidebar" id="sidebar">
    <header class="sb-head">
      <a class="logo" href="#/" aria-label="Home" id="logo"></a>
      <div class="sb-actions">
        <button class="menu-toggle" id="menu-toggle" aria-expanded="false" aria-controls="sidebar">Menu</button>
        <a class="sq-btn" id="gh" href="#" target="_blank" rel="noopener" aria-label="GitHub">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M3 11 11 3M4.5 3H11v6.5"/></svg>
        </a>
      </div>
    </header>

    <a class="sb-index" href="#/">
      <svg width="9" height="9" viewBox="0 0 9 9" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><path d="M1 9V3.5h6.5M5.5 1.5l2 2-2 2"/></svg>
      INDEX
    </a>

    <nav class="sb-nav" aria-label="Sections">
      <a href="#/projects" data-nav="projects">Projects</a>
      <a href="#/archive" data-nav="archive">Archive</a>
      <a href="#/about" data-nav="about">About</a>
    </nav>

    <section class="term" id="terminal" aria-label="Terminal">
      <div class="term__scroll">
        <div class="term__inner">
          <div class="term__out" aria-live="polite"></div>
          <div class="term__line" hidden>
            <span class="term__prompt"></span>
            <span class="term__typed"><span class="term__pre"></span><span class="term__cur">&nbsp;</span><span class="term__post"></span></span>
            <input class="term__input" type="text" aria-label="Terminal input" maxlength="200"
                   autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="send">
          </div>
        </div>
      </div>
    </section>

    <div class="sb-pill" aria-hidden="true"><span></span></div>
  </aside>

  <main class="main" id="view"></main>

  <button class="fx fx--top" id="to-top" aria-label="Back to top">
    <svg width="20" height="18" viewBox="0 0 20 18" fill="none" stroke="currentColor" stroke-width="1.1" aria-hidden="true"><path d="M10 1.5 18.5 16.5h-17z"/></svg>
  </button>
  <button class="fx fx--globe" id="globe" aria-label="Network node">
    <svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width=".9" aria-hidden="true">
      <g transform="rotate(-18 20 20)">
        <circle cx="20" cy="20" r="18"/>
        <ellipse cx="20" cy="20" rx="18" ry="6"/>
        <ellipse cx="20" cy="11" rx="15.2" ry="3.6"/>
        <ellipse cx="20" cy="29" rx="15.2" ry="3.6"/>
        <line x1="2" y1="20" x2="38" y2="20"/>
        <ellipse class="mer" cx="20" cy="20" rx="18" ry="18"/>
        <ellipse class="mer mer--2" cx="20" cy="20" rx="18" ry="18"/>
        <ellipse class="mer mer--3" cx="20" cy="20" rx="18" ry="18"/>
        <ellipse class="mer mer--4" cx="20" cy="20" rx="18" ry="18"/>
      </g>
    </svg>
  </button>

  <noscript><p class="noscript">This site needs JavaScript.</p></noscript>

  <script src="js/secret.js"></script>
  <script src="js/easter-eggs.js"></script>
  <script src="js/data.js"></script>
  <script src="js/art.js"></script>
  <script src="js/terminal.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
